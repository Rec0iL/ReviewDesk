<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2355d6ad'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%230f241e' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/desk.css">
</head>
<body>
<div class="desk">
  <aside class="side">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div><div class="name" data-t="brand"></div><div class="project" id="project"></div></div>
    </div>
    <h2 data-t="rounds"></h2>
    <ul class="rounds" id="rounds"></ul>
    <div class="foot">
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
      <button type="button" class="icon-button" id="bell"></button>
      <button type="button" class="icon-button" id="sound"></button>
      <span class="conn" id="conn"></span>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.BOOT = /*BOOT*/null;</script>
<script src="/i18n.js"></script>
<script src="/extras.js"></script>
<script src="/desk.js"></script>
</body>
</html>
